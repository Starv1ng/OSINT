<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OSINT Platform{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <header>
            <h1>OSINT Intelligence Platform</h1>
            <p>Sistema de inteligencia de fuentes abiertas</p>
            <nav>
                <a href="/">Inicio</a>
                <a href="/search">Búsqueda</a>
                <a href="/jobs">Historial</a>
                <a href="/system">Sistema</a>
            </nav>
        </header>
        
        {% block content %}{% endblock %}
        
        <footer>
            <p>&copy; 2026 OSINT Platform. Sistema profesional de inteligencia.</p>
        </footer>
    </div>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
