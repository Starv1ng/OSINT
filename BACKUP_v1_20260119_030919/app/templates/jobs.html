{% extends "base.html" %}

{% block title %}Historial - OSINT Platform{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/jobs.css">
{% endblock %}

{% block content %}
<main>
    <div class="card">
        <h2>Historial de Búsquedas</h2>
        
        <div class="filter-controls">
            <input 
                type="text" 
                id="searchFilter"
                placeholder="Filtrar por valor de búsqueda..."
            >
            <select id="statusFilter">
                <option value="">Todos los estados</option>
                <option value="accepted">Aceptado</option>
                <option value="processing">Procesando</option>
                <option value="completed">Completado</option>
                <option value="failed">Error</option>
            </select>
        </div>
        
        <div id="jobsList"></div>
        
        <div class="pagination-controls" id="pagination">
            <button class="btn-secondary" id="prevBtn">← Anterior</button>
            <span class="page-info" id="pageInfo"></span>
            <button class="btn-secondary" id="nextBtn">Siguiente →</button>
        </div>
    </div>
</main>

{% endblock %}

{% block extra_js %}
<script src="/static/js/jobs.js"></script>
{% endblock %}
